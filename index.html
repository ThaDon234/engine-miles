<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>N54 Engine Miles</title>

<!-- iOS PWA -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
  --red: #e53935;
  --card: rgba(255,255,255,0.06);
  --blur: blur(14px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  color: #fff;
  background:
    radial-gradient(circle at top, #1a1a1a, #000),
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 2px,
      transparent 2px,
      transparent 6px
    );
}

.wrap {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

.card {
  background: var(--card);
  backdrop-filter: var(--blur);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: inset 0 0 30px rgba(0,0,0,.6);
}

.hero {
  width: 240px;
  height: 240px;
  margin: 10px auto 18px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,.7);
  position: relative;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.heroHint {
  position: absolute;
  bottom: 10px;
  right: 12px;
  font-size: 12px;
  opacity: .6;
}

.center { text-align: center; }

.big {
  font-size: 52px;
  font-weight: 800;
}

.sub { opacity: .6; }

.fadeLine {
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  margin: 12px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.tile {
  text-align: center;
}

.icon {
  font-size: 22px;
  color: var(--red);
}

.start {
  background: linear-gradient(180deg, #ff5252, #c62828);
  border: none;
  width: 100%;
  padding: 16px;
  font-size: 18px;
  color: #fff;
  border-radius: 30px;
  margin: 18px 0;
}

.actions {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.action {
  background: var(--card);
  padding: 12px;
  border-radius: 18px;
  text-align: center;
  font-size: 14px;
}

.reminders button {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 20px;
  border: none;
  background: var(--red);
  color: #fff;
}

.footer {
  text-align: center;
  opacity: .4;
  font-size: 12px;
  margin-top: 10px;
}
</style>
</head>

<body>
<div class="wrap">

<!-- HEADER IMAGE -->
<div class="hero" onclick="pickHero()">
  <img id="heroImg" src="icon.png">
  <div class="heroHint">Tap to change</div>
</div>
<input id="heroPicker" type="file" accept="image/*" hidden>

<!-- ENGINE MILES -->
<div class="card center">
  <div class="sub">Current Engine Miles</div>
  <div class="big" id="engineMiles">0.0</div>
  <div class="sub">miles</div>
  <div class="fadeLine"></div>
  <div class="sub">Trip Miles: <span id="tripMiles">0.0</span></div>
</div>

<!-- STATS -->
<div class="grid">
  <div class="card tile">
    <div class="icon">⏱</div>
    <div id="runtime">00:00:00</div>
    <div class="sub">runtime</div>
  </div>
  <div class="card tile">
    <div class="icon">📍</div>
    <div id="tracked">0.0</div>
    <div class="sub">tracked</div>
  </div>
  <div class="card tile">
    <div class="icon">🏁</div>
    <div id="session">0.0</div>
    <div class="sub">session</div>
  </div>
</div>

<button class="start">▶ START TRACKING</button>

<!-- ACTIONS -->
<div class="actions">
  <div class="action">🔧 Adjust</div>
  <div class="action">➕➖ Add/Sub</div>
  <div class="action">🗑 Clear</div>
</div>

<!-- MAINTENANCE -->
<div class="card reminders">
  <strong>Maintenance Reminders</strong>
  <div class="sub">No reminders yet</div>
  <button>Add Reminder</button>
</div>

<div class="footer">Runs on your device · localStorage · no account</div>
</div>

<script>
function pickHero(){
  document.getElementById('heroPicker').click();
}

heroPicker.onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    localStorage.setItem('hero', r.result);
    heroImg.src = r.result;
  };
  r.readAsDataURL(f);
};

const saved = localStorage.getItem('hero');
if(saved) heroImg.src = saved;
</script>

</body>
</html>
