<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>N54 Engine Miles</title>

<!-- PWA / iOS -->
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --red:#e53935;
  --dark:#0b0b0b;
  --card:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.12);
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  margin:0;
  background:#000;
  color:#fff;
  overflow:hidden;
}

/* background */
.bg{
  position:fixed;inset:0;
  background:
    linear-gradient(135deg,rgba(255,255,255,.04),transparent),
    repeating-linear-gradient(135deg,#000 0,#000 6px,#111 6px,#111 12px);
  z-index:-1;
}

/* splash */
.splash{
  position:fixed;inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99;
}
.splash img{
  width:220px;
  filter:drop-shadow(0 0 25px rgba(229,57,53,.6));
}

/* layout */
.wrap{
  padding:20px;
  max-width:420px;
  margin:auto;
}

.logo{
  display:block;
  margin:20px auto 10px;
  width:200px;
}

/* cards */
.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  margin-bottom:16px;
}

.label{
  text-align:center;
  opacity:.8;
}

.bigMiles{
  font-size:56px;
  font-weight:800;
  text-align:center;
}

.unit{text-align:center;opacity:.7}

.glow{
  height:2px;
  margin:12px 0;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{opacity:.3}
  50%{opacity:1}
  100%{opacity:.3}
}

.sub{
  text-align:center;
  opacity:.8;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.tile{
  background:var(--glass);
  border-radius:16px;
  padding:12px;
  text-align:center;
}

.icon{
  font-size:22px;
  color:var(--red);
  margin-bottom:6px;
}

.tVal{font-size:20px;font-weight:700}

/* buttons */
.btn{
  width:100%;
  border:none;
  border-radius:999px;
  padding:16px;
  font-size:18px;
  font-weight:700;
  margin:12px 0;
}

.btn-main{
  background:linear-gradient(180deg,#ff5f5f,#d32f2f);
  color:#fff;
  box-shadow:0 10px 30px rgba(229,57,53,.6);
}

.btn-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.btn-mini{
  background:var(--glass);
  color:#fff;
  padding:12px;
  font-size:14px;
}

.footer{
  text-align:center;
  opacity:.6;
  font-size:12px;
}
</style>
</head>

<body>
<div class="bg"></div>

<!-- splash -->
<div class="splash" id="splash">
  <img src="icon.png" alt="N54">
</div>

<div class="wrap">

<img class="logo" src="icon.png">

<div class="card">
  <div class="label">Current Engine Miles</div>
  <div class="bigMiles" id="engineMiles">0</div>
  <div class="unit">miles</div>
  <div class="glow"></div>
  <div class="sub">Trip Miles: <span id="tripMiles">0.0</span></div>
</div>

<div class="grid">
  <div class="tile">
    <div class="icon">⏱</div>
    <div class="tVal" id="runtime">00:00:00</div>
    <div class="unit">runtime</div>
  </div>
  <div class="tile">
    <div class="icon">📍</div>
    <div class="tVal"><span id="totalMiles">0.0</span></div>
    <div class="unit">tracked</div>
  </div>
  <div class="tile">
    <div class="icon">🏁</div>
    <div class="tVal"><span id="sessionMiles">0.0</span></div>
    <div class="unit">session</div>
  </div>
</div>

<button class="btn btn-main" id="startBtn">▶ START TRACKING</button>

<div class="btn-row">
  <button class="btn btn-mini" onclick="setMiles()">🔧 Adjust</button>
  <button class="btn btn-mini" onclick="addSubtract()">➕➖ Add/Sub</button>
  <button class="btn btn-mini" onclick="clearAll()">🗑 Clear</button>
</div>

<div class="footer">Runs on your device · localStorage · no account</div>
</div>

<script>
let state = JSON.parse(localStorage.getItem("n54_state")) || {
  engine:0,total:0,trip:0,runtime:0,running:false,last:null
};

const em=document.getElementById("engineMiles");
const tm=document.getElementById("tripMiles");
const tot=document.getElementById("totalMiles");
const ses=document.getElementById("sessionMiles");
const run=document.getElementById("runtime");

function save(){localStorage.setItem("n54_state",JSON.stringify(state))}
function vib(){navigator.vibrate?.(20)}

function update(){
  em.textContent=state.engine.toFixed(1);
  tm.textContent=state.trip.toFixed(1);
  tot.textContent=state.total.toFixed(1);
  ses.textContent=state.trip.toFixed(1);
  run.textContent=new Date(state.runtime*1000).toISOString().substr(11,8);
}
update();

document.getElementById("startBtn").onclick=()=>{
  vib();
  state.running=!state.running;
  state.last=Date.now();
  document.getElementById("startBtn").textContent=
    state.running?"⏸ PAUSE":"▶ START TRACKING";
  save();
};

setInterval(()=>{
  if(!state.running) return;
  const now=Date.now();
  const d=(now-state.last)/1000;
  state.last=now;
  state.runtime+=d;
  const miles=d*0.008; // ~30mph avg
  state.engine+=miles;
  state.total+=miles;
  state.trip+=miles;
  update(); save();
},1000);

function setMiles(){
  vib();
  const v=prompt("Set engine miles:");
  if(v!==null){state.engine=parseFloat(v)||0;update();save();}
}
function addSubtract(){
  vib();
  const v=prompt("Add / subtract miles:");
  if(v!==null){state.engine+=parseFloat(v)||0;update();save();}
}
function clearAll(){
  vib();
  if(confirm("Clear ALL data?")){
    localStorage.removeItem("n54_state");
    location.reload();
  }
}

setTimeout(()=>document.getElementById("splash").style.display="none",1200);
</script>
</body>
</html>
