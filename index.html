<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>N54 Mileage Tracker</title>

  <!-- iOS "Add to Home Screen" -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b0f">

  <style>
    :root{
      --bg:#07070a;
      --card: rgba(20,20,26,.68);
      --card2: rgba(16,16,22,.58);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.58);
      --muted2: rgba(255,255,255,.42);
      --red:#ff2a2a;
      --red2:#c80000;
      --shadow: 0 12px 40px rgba(0,0,0,.55);
      --radius: 22px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

    /* Background: subtle black fade + light carbon */
    .bg{
      position:fixed; inset:0; z-index:-2;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(700px 420px at 10% 30%, rgba(255,0,0,.06), transparent 60%),
        radial-gradient(900px 520px at 90% 70%, rgba(255,0,0,.04), transparent 60%),
        linear-gradient(180deg, #06060a 0%, #0a0a10 35%, #050509 100%);
    }
    .bg:after{
      content:"";
      position:absolute; inset:0;
      opacity:.18;
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 6px, rgba(255,255,255,0) 6px 18px);
      mix-blend-mode: overlay;
      filter: blur(.2px);
    }

    /* Splash */
    .splash{
      position:fixed; inset:0; z-index:50;
      display:flex; align-items:center; justify-content:center;
      background: #05050a;
      transition: opacity .35s ease;
    }
    .splash.hide{ opacity:0; pointer-events:none; }
    .splash img{
      width:120px; height:120px; border-radius:26px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      animation: pop .55s ease;
    }
    @keyframes pop{ from{ transform:scale(.86); opacity:.2 } to{ transform:scale(1); opacity:1 } }

    .wrap{
      padding: 18px 16px 28px;
      padding-top: calc(18px + env(safe-area-inset-top));
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      max-width: 520px;
      margin: 0 auto;
    }

    /* Top bar */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:14px;
    }
    .hambtn{
      width:44px; height:44px; border-radius:14px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--stroke);
      display:flex; align-items:center; justify-content:center;
      box-shadow: var(--shadow);
      cursor:pointer;
    }
    .title{
      font-weight:900; letter-spacing:.12em;
      font-size:16px; opacity:.9;
      text-transform:uppercase;
    }
    .pill{
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      font-size:13px;
      color: var(--muted);
      white-space:nowrap;
    }

    /* Hero image (tap to change) */
    .hero{
      margin: 12px 0 14px;
      display:flex; flex-direction:column; align-items:center;
    }
    .heroImg{
      width: 84%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 70px rgba(0,0,0,.65);
      background: rgba(255,255,255,.05);
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .heroImg img{
      width:100%; height:100%;
      object-fit: cover;
      filter: saturate(.95) contrast(1.05);
      opacity:.95;
    }
    .heroHint{
      margin-top:10px;
      font-size:12px;
      color: var(--muted2);
    }

    /* Cards */
    .card{
      background: var(--card);
      border:1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .mainCard{
      padding: 18px 18px 16px;
    }
    .label{
      text-align:center;
      font-size:18px;
      letter-spacing:.02em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .miles{
      text-align:center;
      font-size: 84px;
      font-weight: 900;
      line-height: 1;
      margin: 6px 0 0;
    }
    .unit{
      text-align:center;
      font-size: 20px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Glowing red line */
    .glowline{
      height: 3px;
      margin: 16px auto 10px;
      width: 92%;
      border-radius: 999px;
      background: linear-gradient(90deg,
        rgba(255,42,42,0) 0%,
        rgba(255,42,42,.55) 18%,
        rgba(255,42,42,1) 50%,
        rgba(255,42,42,.55) 82%,
        rgba(255,42,42,0) 100%);
      box-shadow:
        0 0 10px rgba(255,42,42,.55),
        0 0 26px rgba(255,42,42,.35),
        0 0 52px rgba(255,42,42,.18);
    }

    .sub{
      text-align:center;
      font-size: 16px;
      color: var(--muted);
      margin-top: 8px;
    }
    .sub b{ color: var(--text); }

    /* Tiles row */
    .tiles{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }
    .tile{
      background: var(--card2);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 14px 12px;
      box-shadow: var(--shadow);
      text-align:center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .tileIcon{
      width: 26px; height: 26px;
      margin: 0 auto 8px;
      display:block;
      color: var(--red);
      filter: drop-shadow(0 0 10px rgba(255,42,42,.25));
    }
    .tVal{
      font-size: 40px;
      font-weight: 900;
      line-height: 1.05;
      margin: 2px 0 6px;
    }
    .tSmall{
      font-size: 18px;
      color: var(--muted);
      text-transform: lowercase;
      letter-spacing:.02em;
    }

    /* Buttons */
    .btnBig{
      margin-top: 16px;
      height: 74px;
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,42,42,.98), rgba(180,0,0,.98));
      box-shadow:
        0 16px 50px rgba(255,0,0,.18),
        0 10px 25px rgba(0,0,0,.55);
      color: white;
      font-size: 26px;
      font-weight: 900;
      letter-spacing:.08em;
      text-transform: uppercase;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
    }
    .btnBig:active{ transform: translateY(1px); }

    .btnRow{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }
    .btnSmall{
      height: 58px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 800;
      font-size: 18px;
      display:flex; align-items:center; justify-content:center;
      gap:10px;
      cursor:pointer;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btnSmall:active{ transform: translateY(1px); }
    .btnIcon{
      width: 22px; height:22px;
      color: var(--red);
      filter: drop-shadow(0 0 10px rgba(255,42,42,.25));
    }

    /* Snapshot button */
    .btnWide{
      margin-top: 12px;
      width: 100%;
      height: 62px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 900;
      font-size: 18px;
      display:flex; align-items:center; justify-content:center;
      gap: 10px;
      cursor:pointer;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .meta{
      margin-top:10px;
      text-align:center;
      color: var(--muted2);
      font-size: 13px;
      line-height: 1.4;
    }

    /* Maintenance */
    .section{
      margin-top: 16px;
    }
    .sectionHead{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 10px;
    }
    .sectionTitle{
      font-size: 34px;
      font-weight: 900;
      letter-spacing:.01em;
    }
    .countPill{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-weight: 800;
      font-size: 14px;
    }
    .sectionBody{
      color: var(--muted);
      font-size: 18px;
      line-height: 1.35;
    }
    .sectionButtons{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .btnGhost{
      height: 58px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color: white;
      font-weight: 900;
      font-size: 16px;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .btnRed{
      height: 58px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,42,42,.98), rgba(180,0,0,.98));
      color: white;
      font-weight: 900;
      font-size: 16px;
      cursor:pointer;
      box-shadow: var(--shadow);
    }

    /* Drawer menu */
    .drawerBackdrop{
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 40;
      display:none;
    }
    .drawerBackdrop.show{ display:block; }

    .drawer{
      position: fixed;
      top: 0; left: 0;
      width: 84%;
      max-width: 360px;
      height: 100%;
      background: rgba(10,10,14,.92);
      border-right: 1px solid rgba(255,255,255,.10);
      box-shadow: 30px 0 60px rgba(0,0,0,.65);
      z-index: 41;
      transform: translateX(-102%);
      transition: transform .22s ease;
      padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
      overflow:auto;
    }
    .drawer.show{ transform: translateX(0); }
    .drawerTop{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 14px;
    }
    .drawerTop .dTitle{
      font-weight: 900;
      letter-spacing:.08em;
      opacity:.95;
    }
    .xbtn{
      width:42px; height:42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor:pointer;
    }

    .menuList{
      display:flex; flex-direction:column; gap:10px;
      margin-bottom: 12px;
    }
    .menuItem{
      padding: 14px 14px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 900;
      cursor:pointer;
      display:flex; align-items:center; justify-content:space-between;
    }
    .menuItem small{ color: var(--muted); font-weight:800; }

    .panel{
      display:none;
      margin-top: 12px;
    }
    .panel.show{ display:block; }

    /* Saved files inside menu only */
    .fileBox{
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
