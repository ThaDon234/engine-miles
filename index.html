<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>N54 Mileage Tracker</title>

  <!-- PWA-ish -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050607">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root{
      --bg0:#050607;
      --bg1:#0b0e10;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.075);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.60);
      --muted2: rgba(255,255,255,.45);

      --red:#ff2a2a;
      --red2:#c40012;
      --shadow: 0 18px 45px rgba(0,0,0,.55);
      --shadow2: 0 10px 25px rgba(0,0,0,.55);
      --radius: 22px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 900px at 50% -10%, #1a1f24 0%, var(--bg0) 45%, #000 100%);
      overflow-x:hidden;
    }

    /* subtle carbon overlay (NOT too much) */
    .carbon{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.10; /* <-- control “carbon amount” */
      background:
        repeating-linear-gradient(135deg,
          rgba(255,255,255,.10) 0px,
          rgba(255,255,255,.10) 10px,
          rgba(0,0,0,.20) 10px,
          rgba(0,0,0,.20) 20px
        );
      mix-blend-mode: overlay;
      filter: blur(.2px);
    }

    /* soft vignette */
    .vignette{
      position:fixed; inset:0;
      pointer-events:none;
      background: radial-gradient(70% 55% at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.85) 100%);
    }

    /* splash */
    .splash{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(900px 700px at 50% 40%, #14191e 0%, #050607 60%, #000 100%);
      z-index:9999;
      transition: opacity .35s ease, transform .35s ease;
    }
    .splash.hide{ opacity:0; transform: scale(1.02); pointer-events:none; }
    .splash img{
      width:240px; max-width:70vw;
      border-radius:20px;
      box-shadow: 0 30px 70px rgba(0,0,0,.65);
    }

    .wrap{
      position:relative;
      padding: 22px 18px 28px;
      padding-top: calc(18px + env(safe-area-inset-top));
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      max-width: 520px;
      margin: 0 auto;
    }

    .logoBox{
      display:flex;
      justify-content:center;
      margin-top: 14px;
      margin-bottom: 12px;
    }
    .logoBox img{
      width: 245px;
      max-width: 76%;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .mainCard{
      padding: 16px 16px 14px;
      margin: 10px 0 14px;
      text-align:center;
    }

    .label{
      font-size: 15px;
      letter-spacing: .2px;
      color: var(--muted);
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .milesRow{
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 8px;
    }
    .bigMiles{
      font-size: 64px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 0 10px 25px rgba(0,0,0,.65);
    }
    .unit{
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 9px;
    }

    /* red “glow line” */
    .glowLine{
      height: 4px;
      margin: 10px 6px 10px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        rgba(255,42,42,0) 0%,
        rgba(255,42,42,.55) 20%,
        rgba(255,42,42,1) 50%,
        rgba(255,42,42,.55) 80%,
        rgba(255,42,42,0) 100%
      );
      box-shadow: 0 0 18px rgba(255,42,42,.35);
      opacity: .85;
    }

    .sub{
      color: var(--muted);
      font-size: 15px;
    }

    .grid3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .tile{
      padding: 14px 12px 12px;
      text-align:center;
    }

    .iconTop{
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 8px;
    }
    .iconTop svg{
      width: 26px;
      height: 26px;
      stroke: var(--red);
      fill: none;
      filter: drop-shadow(0 0 10px rgba(255,42,42,.25));
    }

    .tLabel{
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 4px;
      line-height: 1.1;
    }
    .tVal{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.2px;
      margin-bottom: 2px;
    }
    .tUnit{
      font-size: 13px;
      color: var(--muted2);
      margin-top: 2px;
    }

    .bigBtn{
      width:100%;
      margin: 14px 0 12px;
      padding: 16px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,42,42,1), rgba(196,0,18,1));
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: .7px;
      box-shadow: 0 18px 50px rgba(255,42,42,.18), 0 20px 60px rgba(0,0,0,.55);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-transform: uppercase;
    }
    .bigBtn:active{ transform: translateY(1px); }

    .miniRow{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 10px;
    }

    .miniBtn{
      padding: 12px 10px;
      border-radius: 16px;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.035));
      color: var(--text);
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      cursor:pointer;

      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      font-weight: 800;
    }
    .miniBtn:active{ transform: translateY(1px); }

    .miniBtn svg{
      width: 20px;
      height: 20px;
      stroke: var(--red);
      fill: none;
