<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>N54 Mileage Tracker</title>

  <!-- iOS / PWA-ish -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Icons (make sure icon.png exists in repo root) -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root{
      --bg:#070809;
      --card:#0f1113;
      --card2:#0c0d0f;
      --text:#f2f2f2;
      --muted:#a9adb3;
      --border:rgba(255,255,255,.08);
      --red:#e44b4b;
      --red2:#c93f3f;
      --shadow: 0 18px 40px rgba(0,0,0,.55);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 50% -200px, rgba(255,255,255,.08), transparent 55%),
                  linear-gradient(180deg, #050607, #090a0b);
      color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      padding: 18px 16px 22px;
    }

    .wrap{
      max-width: 520px;
      margin: 0 auto;
      min-height: calc(100vh - 40px);
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    /* Splash */
    .splash{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(900px 500px at 50% 25%, rgba(255,255,255,.10), transparent 55%),
                  linear-gradient(180deg, #050607, #090a0b);
      z-index:9999;
      transition: opacity .35s ease, transform .35s ease;
    }
    .splash.hide{
      opacity:0;
      transform: scale(1.02);
      pointer-events:none;
    }
    .splash-card{
      width:min(360px, 92vw);
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-radius: 22px;
      padding: 22px 18px;
      box-shadow: var(--shadow);
      text-align:center;
    }
    .splash-logo{
      width: 86px;
      height: 86px;
      border-radius: 22px;
      object-fit: cover;
      border:1px solid var(--border);
      box-shadow: 0 12px 30px rgba(0,0,0,.55);
      margin-bottom: 14px;
    }
    .splash-title{
      font-size: 18px;
      font-weight: 800;
      letter-spacing:.2px;
      margin:0 0 6px;
    }
    .splash-sub{
      margin:0;
      color:var(--muted);
      font-size: 13px;
    }

    /* Main card */
    .panel{
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tile{
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.15));
      border-radius: 18px;
      padding: 14px 14px 12px;
      min-height: 92px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .label{
      color: var(--muted);
      font-size: 12px;
      letter-spacing:.2px;
    }

    .value{
      font-size: 32px;
      font-weight: 900;
      letter-spacing: .2px;
      line-height: 1;
      margin-top: 2px;
    }

    .hint{
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    /* Make the “Trip Miles” span across */
    .span2{ grid-column: 1 / -1; }

    /* Big button */
    .cta-wrap{
      margin-top:auto;
      padding-top: 8px;
    }

    .cta{
      width:100%;
      height: 66px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      background: linear-gradient(180deg, var(--red), var(--red2));
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .6px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      box-shadow: 0 18px 34px rgba(228,75,75,.35);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:active{ transform: translateY(1px); }

    .play{
      width:0;height:0;
      border-left: 12px solid #fff;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      margin-left: 4px;
    }

    .stop{
      width: 14px;
      height: 14px;
      background:#fff;
      border-radius: 3px;
    }

    /* Small top note (optional but subtle) */
    .topnote{
      color: var(--muted);
      font-size: 12px;
      text-align:center;
      margin-top: 2px;
    }

    /* Tap-to-set helper */
    .tapset{
      opacity:.95;
    }
  </style>
</head>

<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash-card">
      <img class="splash-logo" src="icon.png" alt="App icon">
      <p class="splash-title">N54 Mileage Tracker</p>
      <p class="splash-sub">Tracking engine miles (on-device)</p>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="grid">
        <!-- Duration -->
        <div class="tile">
          <div class="label">Duration</div>
          <div class="value" id="dur">00:00:00</div>
          <div class="hint" id="gps">GPS: Stopped</div>
        </div>

        <!-- Engine miles (tap to set) -->
        <div class="tile tapset" id="tileEngine">
          <div class="label">Engine Miles</div>
          <div class="value" id="engineMiles">0.0</div>
          <div class="hint">Tap to set</div>
        </div>

        <!-- Trip miles (this session) -->
        <div class="tile span2">
          <div class="label">Trip Miles (this session)</div>
          <div class="value" id="tripMiles">0.00</div>
          <div class="hint">Auto-add while tracking</div>
        </div>
      </div>

      <div class="topnote">Saves on your device (localStorage). No account.</div>
    </div>

    <div class="cta-wrap">
      <button id="btn" class="cta" type="button">
        <span id="btnIcon" class="play"></span>
        <span id="btnText">START</span>
      </button>
    </div>
  </div>

<script>
(() => {
  // ---------- storage ----------
  const KEY = "engine_miles_tracker_v2";
  const state = load() || {
    engineMiles: 0,
    // trip session
    tripMiles: 0,
    running: false,
    startTime: null,
    // gps
    lastLat: null,
    lastLon: null,
    lastAcc: null
  };

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY) || ""); }
    catch { return null; }
  }
  function save(){
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  // ---------- UI ----------
  const elEngine = document.getElementById("engineMiles");
  const elTrip = document.getElementById("tripMiles");
  const elDur = document.getElementById("dur");
  const elGps = document.getElementById("gps");
  const btn = document.getElementById("btn");
  const btnText = document.getElementById("btnText");
  const btnIcon = document.getElementById("btnIcon");
  const tileEngine = document.getElementById("tileEngine");

  // Splash (quick)
  const splash = document.getElementById("splash");
  setTimeout(() => splash.classList.add("hide"), 550);

  // Tap engine miles to set
  tileEngine.addEventListener("click", () => {
    const current = Number(state.engineMiles || 0);
    const val = prompt("Set engine miles (exact):", String(current));
    if (val === null) return;
    const n = Number(val);
    if (!Number.isFinite(n) || n < 0) return alert("Enter a valid number.");
    state.engineMiles = n;
    save();
    render();
  });

  // ---------- tracking ----------
  let watchId = null;
  let uiTimer = null;

  function fmtMiles(n, decimals){
    const d = typeof decimals === "number" ? decimals : 1;
    return (Math.round(n * (10**d)) / (10**d)).toFixed(d);
  }

  function fmtTime(ms){
    const s = Math.max(0, Math.floor(ms/1000));
    const hh = String(Math.floor(s/3600)).padStart(2,"0");
    const mm = String(Math.floor((s%3600)/60)).padStart(2,"0");
    const ss = String(s%60).padStart(2,"0");
    return `${hh}:${mm}:${ss}`;
  }

  function haversineMiles(lat1, lon1, lat2, lon2){
    const R = 3958.7613; // miles
    const toRad = (x) => x * Math.PI/180;
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function start(){
    if (!navigator.geolocation) return alert("Geolocation not supported.");

    // New session each start (no reset button needed)
    state.tripMiles = 0;
    state.startTime = Date.now();
    state.running = true;
    state.lastLat = null;
    state.lastLon = null;
    state.lastAcc = null;
    save();

    elGps.textContent = "GPS: Starting…";
    setBtn(true);

    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 15000
    });

    if (!uiTimer){
      uiTimer = setInterval(render, 250);
    }
    render();
  }

  function stop(){
    state.running = false;
    save();

    if (watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (uiTimer){
      clearInterval(uiTimer);
      uiTimer = null;
    }

    elGps.textContent = "GPS: Stopped";
    setBtn(false);
    render();
  }

  function setBtn(running){
    if (running){
      btnText.textContent = "STOP";
      btnIcon.className = "stop";
    } else {
      btnText.textContent = "START";
      btnIcon.className = "play";
    }
  }

  function onPos(pos){
    const { latitude, longitude, accuracy } = pos.coords;

    // Ignore super-bad points
    if (!Number.isFinite(accuracy) || accuracy > 80){
      elGps.textContent = "GPS: Weak signal";
      return;
    }

    elGps.textContent = "GPS: Tracking";

    if (state.lastLat != null && state.lastLon != null){
      const add = haversineMiles(state.lastLat, state.lastLon, latitude, longitude);

      // Ignore tiny jitter
      if (add > 0.01 && add < 5){
        state.tripMiles += add;
        state.engineMiles += add;   // <-- this is the “automatic add”
        save();
      }
    }

    state.lastLat = latitude;
    state.lastLon = longitude;
    state.lastAcc = accuracy;
  }

  function onErr(err){
    elGps.textContent = "GPS: Blocked";
    // If location is denied, stop cleanly
    if (err && err.code === 1) stop();
  }

  function render(){
    elEngine.textContent = fmtMiles(state.engineMiles || 0, 1);
    elTrip.textContent = fmtMiles(state.tripMiles || 0, 2);

    if (state.running && state.startTime){
      elDur.textContent = fmtTime(Date.now() - state.startTime);
    } else {
      elDur.textContent = "00:00:00";
    }
  }

  // Button toggle
  btn.addEventListener("click", () => {
    if (state.running) stop();
    else start();
  });

  // Init
  setBtn(!!state.running);
  if (state.running){
    // If the page reloads while "running", we stop safely
    stop();
  } else {
    render();
  }
})();
</script>
</body>
</html>
